<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Compliance RAG</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-top: 0; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        select, button { padding: 10px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; }
        select { flex: 1; }
        .chat-box { height: 450px; border: 1px solid #ddd; border-radius: 4px; padding: 15px; overflow-y: scroll; background: #fafafa; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 6px; max-width: 80%; line-height: 1.4; }
        .user-msg { background: #007bff; color: white; align-self: flex-end; }
        .bot-msg { background: #e2e8f0; color: #333; align-self: flex-start; white-space: pre-wrap; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        button#send-btn { background: #28a745; color: white; border: none; cursor: pointer; padding: 0 20px; font-weight: bold; }
        button#send-btn:hover { background: #218838; }
        .sources { font-size: 12px; color: #666; margin-top: 5px; border-top: 1px dashed #ccc; padding-top: 5px; }
    </style>
</head>
<body>  

<div class="container">
    <h2>✈️ Multi-Authority Aviation Compliance RAG</h2>
    
    <div class="controls">
        <label for="authority-select" style="align-self: center; font-weight: bold;">Authority Filter:</label>
        <select id="authority-select">
            <option value="ALL">ALL (EASA, CAAS, CAAC)</option>
            <option value="EASA">EASA only</option>
            <option value="CAAS">CAAS only</option>
            <option value="CAAC">CAAC only</option>
        </select>
    </div>

    <div class="chat-box" id="chat-box">
        <div class="message bot-msg">System ready. Ask any regulatory compliance question regarding EASA, CAAS, or CAAC documents.</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your compliance question here..." />
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const authoritySelect = document.getElementById("authority-select");
        
        const question = inputField.value.trim();
        if (!question) return;

        chatBox.innerHTML += `<div class="message user-msg">${escapeHtml(question)}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingId = "loading-" + Date.now();
        chatBox.innerHTML += `<div class="message bot-msg" id="${loadingId}">Analyzing regulations locally...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch("/api/query", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question, authority: authoritySelect.value })
            });

            const data = await response.json();
            const loadingMsg = document.getElementById(loadingId);

            if (response.ok) {
                loadingMsg.innerHTML = `${escapeHtml(data.answer)}<div class="sources"><strong>Sources:</strong><br>${escapeHtml(data.sources)}</div>`;
            } else {
                loadingMsg.innerText = `Error: ${data.detail || "Failed to retrieve response"}`;
            }
        } catch (err) {
            document.getElementById(loadingId).innerText = `Network Error: Could not connect to local server.`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById("user-input").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            sendMessage();
        }
    });

        function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
